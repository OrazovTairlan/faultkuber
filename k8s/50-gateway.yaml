apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: aitu-sim
  labels: {app: gateway}
spec:
  replicas: 2
  minReadySeconds: 3
  selector:
    matchLabels: {app: gateway}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: gateway}
      containers:
        - name: gateway
          image: aitu-sim:1.2
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVICE, value: gateway}
            - {name: PORT, value: "8080"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AUTH_SECRET
              valueFrom: {secretKeyRef: {name: auth-secret, key: AUTH_SECRET}}
          envFrom:
            - configMapRef: {name: aitu-config}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aitu-sim
  labels: {app: gateway}
spec:
  type: NodePort
  selector: {app: gateway}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: aitu-sim
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: gateway}
